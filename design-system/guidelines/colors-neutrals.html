<!-- @dsCard group="Colors" viewport="700x150" subtitle="Cool blue-cast neutrals" name="Neutrals" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 16px; }
  .sw { height: 84px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font: 600 11px/1.3 var(--font-body); color: var(--dc-neutral-700); }
  code { font-size: 10px; opacity: 0.7; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--dc-white);"><span>white<br><code>#FFFFFF</code></span></div>
    <div class="sw" style="background: var(--dc-neutral-50);"><span>50<br><code>#F6F8FB</code></span></div>
    <div class="sw" style="background: var(--dc-neutral-100);"><span>100<br><code>#EDF1F7</code></span></div>
    <div class="sw" style="background: var(--dc-neutral-200);"><span>200<br><code>#DCE3EC</code></span></div>
    <div class="sw" style="background: var(--dc-neutral-300);"><span>300<br><code>#C2CCD9</code></span></div>
    <div class="sw" style="background: var(--dc-neutral-500); color: #fff;"><span>500<br><code>#5C7189</code></span></div>
    <div class="sw" style="background: var(--dc-neutral-700); color: #fff;"><span>700<br><code>#33475C</code></span></div>
  </div>
</body></html>
