<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--surface-page); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border: none; }
  .tok { font: var(--type-caption); color: var(--text-muted); width: 110px; flex: none; }
  .s { color: var(--text-display); letter-spacing: var(--tracking-display); }
</style></head>
<body>
  <div class="row"><span class="tok">--type-h1 · 40</span><span class="s" style="font: var(--type-h1);">Autoridad médica</span></div>
  <div class="row"><span class="tok">--type-h2 · 30</span><span class="s" style="font: var(--type-h2);">Autoridad médica</span></div>
  <div class="row"><span class="tok">--type-h3 · 22</span><span class="s" style="font: var(--type-h3);">Autoridad médica digital</span></div>
  <div class="row"><span class="tok">--type-h4 · 17</span><span class="s" style="font: var(--type-h4);">Autoridad médica digital previsible</span></div>
</body></html>
