<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Soft but disciplined; pill for tags & CTAs" name="Corner radii" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); display: flex; gap: 14px; align-items: center; }
  .box { width: 108px; height: 76px; background: var(--dc-white); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font: var(--type-caption); color: var(--text-muted); text-align: center; }
</style></head>
<body>
  <div class="box" style="border-radius: var(--radius-sm);">sm · 6</div>
  <div class="box" style="border-radius: var(--radius-md);">md · 10</div>
  <div class="box" style="border-radius: var(--radius-lg);">lg · 16</div>
  <div class="box" style="border-radius: var(--radius-xl);">xl · 24</div>
  <div class="box" style="border-radius: var(--radius-pill); width: 150px; height: 48px;">pill · 999</div>
</body></html>
