<!-- @dsCard group="Brand" viewport="700x170" subtitle="Lucide via CDN — substitution; 4C pillars use numerals" name="Iconography" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-page); display: flex; align-items: center; gap: 28px; }
  .icons { display: flex; gap: 18px; color: var(--dc-royal-600); }
  .icons svg { width: 24px; height: 24px; }
  .num { width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--surface-wash); color: var(--dc-royal-600); display: flex; align-items: center; justify-content: center; font: 800 24px/1 var(--font-display); }
  .nums { display: flex; gap: 10px; }
  .meta { font: var(--type-caption); color: var(--text-muted); max-width: 190px; }
</style></head>
<body>
  <div class="icons">
    <i data-lucide="stethoscope"></i>
    <i data-lucide="calendar-check"></i>
    <i data-lucide="video"></i>
    <i data-lucide="trending-up"></i>
    <i data-lucide="heart-pulse"></i>
    <i data-lucide="check-circle-2"></i>
  </div>
  <div class="nums"><div class="num">1</div><div class="num">2</div><div class="num">3</div><div class="num">4</div></div>
  <div class="meta">Lucide 1.75px stroke (sustituto CDN) · numerales Montserrat para los pilares 4C · sin emoji</div>
  <script>lucide.createIcons();</script>
</body></html>
