<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border-radius: var(--radius-lg); overflow: hidden; position: relative; height: 176px; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(2,39,70,0.82) 0%, rgba(2,39,70,0.25) 60%, rgba(2,39,70,0) 100%); display: flex; align-items: center; padding: 0 20px; }
  .veil span { font: 800 17px/1.3 var(--font-display); color: #fff; max-width: 55%; }
</style></head>
<body>
  <div class="tile"><img src="../assets/bg-studio-shelf.png" alt="Estudio"><div class="veil"><span>Overlay de protección navy para texto</span></div></div>
  <div class="tile"><img src="../assets/bg-studio-mic.png" alt="Estudio con micrófono"></div>
</body></html>
