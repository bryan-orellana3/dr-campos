<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: 3fr 1fr 2fr; gap: 8px; padding: 16px; }
  .sw { height: 84px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; color: #fff; font: 600 11px/1.3 var(--font-body); }
  .orb { border-radius: 50%; width: 84px; justify-self: center; align-items: center; justify-content: center; text-align: center; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--gradient-wordmark);"><span>--gradient-wordmark · headline words, EKG rule</span></div>
    <div class="sw orb" style="background: var(--gradient-orb);"><span>orb</span></div>
    <div class="sw" style="background: var(--gradient-hero-dark);"><span>--gradient-hero-dark · hero / CTA sections</span></div>
  </div>
</body></html>
