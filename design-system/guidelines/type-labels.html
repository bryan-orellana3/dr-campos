<!-- @dsCard group="Type" viewport="700x170" subtitle="Eyebrow labels + script accent" name="Labels & script" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
  .eyebrow { font: var(--type-label); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--dc-royal-600); }
  h3 { font: var(--type-h3); color: var(--text-display); margin: 6px 0 0; }
  .script { font: 400 52px/1 var(--font-script); color: var(--dc-navy-800); }
  .meta { font: var(--type-caption); color: var(--text-muted); margin-top: 6px; }
</style></head>
<body>
  <div>
    <div class="eyebrow">Método 4C</div>
    <h3>Constancia antes que suerte</h3>
    <div class="meta">--type-label · uppercase · +0.14em · royal-600</div>
  </div>
  <div>
    <div class="script">Dr. Campos</div>
    <div class="meta">--font-script (Brittany Signature · fallback Sacramento) · single accent words only</div>
  </div>
</body></html>
