<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); display: flex; flex-direction: column; gap: 8px; }
  .hero { font: var(--type-hero); letter-spacing: var(--tracking-display); color: var(--text-display); margin: 0; }
  .hero em { font-style: normal; background: var(--gradient-wordmark); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meta { font: var(--type-caption); color: var(--text-muted); }
</style></head>
<body>
  <div class="hero">Método, no <em>suerte.</em></div>
  <div class="meta">--type-hero · Montserrat 800 · 56/1.08 · gradient on one key word max</div>
</body></html>
