<!-- @dsCard group="Spacing" viewport="700x180" subtitle="4px-based scale" name="Spacing tokens" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; font: var(--type-caption); color: var(--text-muted); }
  .bar { width: 34px; background: var(--dc-sky-200); border-radius: 4px 4px 0 0; border: 1px solid var(--dc-sky-300); border-bottom: none; }
</style></head>
<body>
  <div class="col"><div class="bar" style="height: 4px;"></div>1 · 4</div>
  <div class="col"><div class="bar" style="height: 8px;"></div>2 · 8</div>
  <div class="col"><div class="bar" style="height: 12px;"></div>3 · 12</div>
  <div class="col"><div class="bar" style="height: 16px;"></div>4 · 16</div>
  <div class="col"><div class="bar" style="height: 24px;"></div>5 · 24</div>
  <div class="col"><div class="bar" style="height: 32px;"></div>6 · 32</div>
  <div class="col"><div class="bar" style="height: 48px;"></div>7 · 48</div>
  <div class="col"><div class="bar" style="height: 64px;"></div>8 · 64</div>
  <div class="col"><div class="bar" style="height: 96px;"></div>9 · 96</div>
</body></html>
