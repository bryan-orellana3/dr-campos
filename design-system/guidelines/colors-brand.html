<!-- @dsCard group="Colors" viewport="700x150" subtitle="Navy → sky, the single brand hue" name="Brand blues" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-caption); color: var(--text-muted); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 16px; }
  .sw { height: 84px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; color: #fff; font: 600 11px/1.3 var(--font-body); }
  .sw span { display: block; }
  code { font-size: 10px; opacity: 0.75; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--dc-navy-950);"><span>navy-950<br><code>#041A30</code></span></div>
    <div class="sw" style="background: var(--dc-navy-900);"><span>navy-900<br><code>#022746</code></span></div>
    <div class="sw" style="background: var(--dc-navy-800);"><span>navy-800<br><code>#02325A</code></span></div>
    <div class="sw" style="background: var(--dc-royal-600);"><span>royal-600<br><code>#0A5CA8</code></span></div>
    <div class="sw" style="background: var(--dc-blue-500);"><span>blue-500<br><code>#1D7BC9</code></span></div>
    <div class="sw" style="background: var(--dc-sky-400);"><span>sky-400<br><code>#4FA8E0</code></span></div>
    <div class="sw" style="background: var(--dc-sky-300); color: var(--dc-navy-800);"><span>sky-300<br><code>#8FCBEF</code></span></div>
  </div>
</body></html>
