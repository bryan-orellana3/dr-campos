<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); display: grid; grid-template-rows: 1fr 1fr; }
  .half { display: flex; align-items: center; padding: 0 32px; }
  .dark { background: var(--dc-navy-900); }
  svg { width: 100%; }
</style></head>
<body>
  <div class="half"><svg viewBox="0 0 640 24" fill="none"><path d="M0 12 H420 L436 12 444 3 456 21 466 12 H640" stroke="url(#g)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><defs><linearGradient id="g" x1="0" x2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#02325A"></stop><stop offset="1" stop-color="#4FA8E0"></stop></linearGradient></defs></svg></div>
  <div class="half dark"><svg viewBox="0 0 640 24" fill="none"><path d="M0 12 H420 L436 12 444 3 456 21 466 12 H640" stroke="var(--dc-pulse-400)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="filter: drop-shadow(0 0 7px rgba(62,205,232,0.75));"></path></svg></div>
</body></html>
