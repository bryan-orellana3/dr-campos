<!-- @dsCard group="Colors" viewport="700x150" subtitle="Pulse cyan + desaturated status colors" name="Accent & semantic" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; padding: 16px; }
  .sw { height: 84px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; color: #fff; font: 600 11px/1.3 var(--font-body); }
  .pulse { background: var(--dc-navy-900); position: relative; }
  .pulse svg { position: absolute; top: 30px; left: 12px; right: 12px; width: calc(100% - 24px); filter: drop-shadow(0 0 8px rgba(62, 205, 232, 0.7)); }
  code { font-size: 10px; opacity: 0.75; }
</style></head>
<body>
  <div class="row">
    <div class="sw pulse">
      <svg viewBox="0 0 200 24" fill="none"><path d="M0 12 H80 L88 12 92 3 98 21 103 12 H200" stroke="var(--dc-pulse-400)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      <span>pulse-400 · EKG accent, dark only<br><code>#3ECDE8</code></span>
    </div>
    <div class="sw" style="background: var(--dc-success);"><span>success<br><code>#1E8A5E</code></span></div>
    <div class="sw" style="background: var(--dc-warning);"><span>warning<br><code>#B97E1F</code></span></div>
    <div class="sw" style="background: var(--dc-danger);"><span>danger<br><code>#C0453E</code></span></div>
  </div>
</body></html>
