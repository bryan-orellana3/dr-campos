<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
  .tile { border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; padding: 12px; height: 160px; box-sizing: border-box; }
  .light { background: var(--dc-white); border: 1px solid var(--border-subtle); }
  .wash { background: var(--surface-wash); }
  img { max-width: 100%; max-height: 100%; }
</style></head>
<body>
  <div class="tile light"><img src="../assets/logo.png" alt="Dr. David Campos"></div>
  <div class="tile wash"><img src="../assets/logo.png" alt="Dr. David Campos sobre wash"></div>
</body></html>
