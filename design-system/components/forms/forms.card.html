<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; background: var(--surface-page); }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.DrDavidCamposDesignSystem_2a5067;
function Demo() {
  const [esp, setEsp] = React.useState('');
  const [ok, setOk] = React.useState(true);
  const [freq, setFreq] = React.useState('3');
  const [rec, setRec] = React.useState(true);
  return (
    <div style={{ padding: 20, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
      <Input label="Correo profesional" placeholder="dr@clinica.com" hint="Nunca compartimos tu correo." />
      <Select label="Especialidad" placeholder="Selecciona…" value={esp} onChange={(e) => setEsp(e.target.value)} options={['Cardiología', 'Dermatología', 'Pediatría', 'Medicina interna']} />
      <Input label="Nombre completo" error="Campo obligatorio" />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, paddingTop: 4 }}>
        <Checkbox label="Acepto recibir la guía semanal" checked={ok} onChange={() => setOk(!ok)} />
        <div style={{ display: 'flex', gap: 18 }}>
          <Radio name="f" label="3 posts/semana" checked={freq === '3'} onChange={() => setFreq('3')} />
          <Radio name="f" label="Diario" checked={freq === 'd'} onChange={() => setFreq('d')} />
        </div>
        <Switch label="Recordatorio diario" checked={rec} onChange={() => setRec(!rec)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
